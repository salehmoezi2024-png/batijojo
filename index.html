<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>باتی جوجویی | شهر جوجه‌ها</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;900&display=swap">
<style>
:root{--bg:#fff3c9;--ink:#5b0f14;--sub:#8a4b00;--card:#ffe08a;--line:#e0a800;--red:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#25090c;--ink:#ffe9a8;--sub:#f2c46d;--card:#4a1218;--line:#a87a00}}
:root[data-theme="dark"]{--bg:#25090c;--ink:#ffe9a8;--sub:#f2c46d;--card:#4a1218;--line:#a87a00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif}
.wrap{max-width:520px;margin:0 auto;overflow-x:clip}
.hero{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:0 0 30px 30px;background:#f5b700}
.hero img{display:block;width:100%;height:100%;object-fit:cover;animation:push 14s ease-out infinite alternate}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:42%;background:linear-gradient(transparent,rgba(60,0,8,.85))}
.badge{position:absolute;top:14px;right:14px;z-index:3;background:var(--red);color:#fff;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:700;animation:bob 2s ease-in-out infinite}
.ht{position:absolute;z-index:3;bottom:16px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.ht h1{margin:0;font-size:clamp(40px,12vw,58px);font-weight:900;line-height:1.1;color:#ffe27a}
.ht p{margin:6px 0 0;font-size:19px;font-weight:700}
.coin{position:absolute;z-index:2;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff7c2,#f5b700 60%,#b8860b);animation:fall linear infinite;pointer-events:none}
.body{padding:20px 18px 120px;text-align:center}
.verbs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px}
.verbs span{background:var(--red);color:#fff;border-radius:99px;padding:6px 14px;font-size:15px;font-weight:700}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 6px;font-weight:700;font-size:16px;opacity:0;transform:scale(.85);animation:pop .45s forwards;animation-delay:var(--d)}
.more{margin:16px 0 0;color:var(--sub);font-size:16px;font-weight:500;line-height:1.8}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:28px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 45%)}
.btn{display:block;max-width:488px;margin:0 auto;text-align:center;text-decoration:none;color:#fff;font-weight:900;font-size:21px;padding:16px;border-radius:18px;background:linear-gradient(180deg,#e53935,#b71c1c);box-shadow:0 6px 0 #7f0f12,0 12px 24px rgba(183,28,28,.35);animation:pulse 1.7s ease-in-out infinite}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #7f0f12}
.btn:focus-visible{outline:3px solid #ffe27a;outline-offset:3px}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes fall{from{top:-6%;transform:rotate(0)}to{top:104%;transform:rotate(540deg)}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.035)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.chip{opacity:1;transform:none}}
</style>
</head>
